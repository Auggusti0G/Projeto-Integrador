<section id="screen-register" class="screen">
    <div class="auth-container">
        <div class="logo-box"><i class="fas fa-envelope-open-text"></i></div>
        <h2 style="margin-bottom: 20px;">Criar Conta</h2>
        
        <div class="field">
            <label>Nome Completo</label>
            <input type="text" id="nome_completo" placeholder="Seu nome">
        </div>
        
        <div class="field">
            <label>E-mail Profissional</label>
            <input type="email" id="email_prof" placeholder="email@exemplo.com">
        </div>
        
        <div class="field">
            <label>Senha</label>
            <input type="password" id="senha_prof" placeholder="••••••••">
        </div>
        
        <button class="btn btn-main" onclick="processarCadastro()">Finalizar Cadastro</button>
        <button class="btn btn-sec" onclick="goTo('screen-landing')">Voltar</button>
    </div>
</section>
